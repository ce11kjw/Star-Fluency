<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Star-Fluency</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e14; --card:#141a24; --card2:#1b2330; --line:#232c3a;
  --txt:#e8edf4; --dim:#7d8899; --lime:#c6f24e; --cyan:#4ee0f2;
  --red:#f25b5b; --amber:#f2b84e;
}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
     padding:0 0 24px;min-height:100vh}
.hdr{padding:18px 16px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#121a26,var(--bg))}
.hdr h1{font-size:19px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.hdr h1 span{color:var(--lime)}
.hdr p{font-size:11.5px;color:var(--dim);margin-top:3px}
.tabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 15px;border-radius:9px;background:var(--card);border:1px solid var(--line);
     font-size:13px;color:var(--dim);cursor:pointer;transition:.15s;white-space:nowrap}
.tab.on{background:var(--lime);color:#0a0e14;border-color:var(--lime);font-weight:600}
.pane{display:none;padding:14px 16px 0}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px}
.card h3{font-size:13.5px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between}
.card h3 em{font-style:normal;font-size:11px;color:var(--dim);font-weight:400}
.seg{display:flex;gap:7px;margin-bottom:4px}
.seg button{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
            color:var(--dim);font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.seg button.on{background:var(--lime);border-color:var(--lime);color:#0a0e14;font-weight:700}
.seg button:active{transform:scale(.97)}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:0}
.row .k{color:var(--dim)}
.row .v{color:var(--txt);font-family:ui-monospace,monospace;font-size:12.5px}
.row .v.diff{color:var(--lime)}
.row .v.same{color:var(--dim)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--card2);border-radius:10px;padding:11px 12px}
.stat .lbl{font-size:11px;color:var(--dim);margin-bottom:3px}
.stat .num{font-size:19px;font-weight:700;font-family:ui-monospace,monospace;letter-spacing:-.5px}
.stat .num small{font-size:11px;font-weight:400;color:var(--dim);margin-left:2px}
.stat .sub{font-size:10.5px;color:var(--dim);margin-top:2px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));border-radius:3px;transition:width .4s}
.sw{position:relative;width:46px;height:27px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--line);border-radius:15px;cursor:pointer;transition:.2s}
.sw i:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#8a94a6;border-radius:50%;transition:.2s}
.sw input:checked+i{background:var(--lime)}
.sw input:checked+i:before{transform:translateX(19px);background:#0a0e14}
.btn{padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);
     font-size:13px;cursor:pointer;font-family:inherit;width:100%;transition:.15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--lime);color:#0a0e14;border-color:var(--lime);font-weight:600}
.btn.warn{color:var(--amber);border-color:#3a3020}
.btn.danger{color:var(--red);border-color:#3a2020}
.btns{display:flex;gap:8px}
.log{background:#070a0e;border:1px solid var(--line);border-radius:9px;padding:10px;
     font:11px/1.6 ui-monospace,monospace;color:#8fa3b8;max-height:340px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
.hint{font-size:11.5px;color:var(--dim);line-height:1.6;margin-top:9px}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:5px;background:#1f2836;color:var(--dim);margin-left:6px}
.tag.ok{background:#1a2a1a;color:#7dd87d}
.tag.no{background:#2a1a1a;color:#d87d7d}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(70px);background:var(--lime);
       color:#0a0e14;padding:10px 20px;border-radius:22px;font-size:13px;font-weight:600;opacity:0;
       transition:.25s;pointer-events:none;z-index:99;max-width:86%;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--lime);
      border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 玻璃效果暂不可用：容器保持透明、canvas 隐藏 */
#glass-canvas{display:none}
#app-scene,#main{position:static;padding-top:0}
</head>
<body>
<div id="app-scene">
<canvas id="glass-canvas"></canvas>
<main id="main">
<div id="rebootBanner" style="display:none;margin:12px 16px 0;padding:12px 14px;border-radius:14px;background:rgba(255,69,58,.16);border:1px solid rgba(255,69,58,.45);color:#ff6b61;font-size:12.5px;line-height:1.6">⚠️ /dev/null 被重建过，WebView 要重启手机才能恢复（重启后本提示自动消失）</div>

<div class="hdr">
  <h1>Star <span>Fluency</span></h1>
  <p>小米11 Ultra 流畅优化 · 动图修复</p>
</div>

<div class="tabs">
  <div class="tab on" data-p="tune">调优</div>
  <div class="tab" data-p="net">网络</div>
  <div class="tab" data-p="motion">动图</div>
  <div class="tab" data-p="trim">精简</div>
  <div class="tab" data-p="stat">状态</div>
  <div class="tab" data-p="diag">诊断</div>
  <div class="tab" data-p="sched">调度</div>
</div>

<!-- ========== 调优 ========== -->
<div class="pane on" id="p-tune">
  <div class="card g">
    <h3>CPU / 电池实时 <em id="hpTag"></em></h3>
    <div class="grid">
      <div class="stat">
        <div class="lbl">电池健康 <em id="hpSrcTag" class="tag">-</em></div>
        <div class="num" id="hpHealth">-<small>%</small></div>
        <div class="bar"><i id="hpBar" style="width:0%"></i></div>
        <div class="sub" id="hpHealthSub">-</div>
      </div>
      <div class="stat">
        <div class="lbl">CPU 核心温度</div>
        <div class="num" id="hpCpuTemp2">-<small>°C</small></div>
        <div class="sub" id="hpCpuFreq2">-</div>
      </div>
    </div>
    <div class="row"><span class="k">电池温度</span><span class="v" id="hpBatTemp">-</span></div>
    <div class="row"><span class="k">放电电流</span><span class="v" id="hpBatCur">-</span></div>
    <div class="row"><span class="k">功率</span><span class="v" id="hpBatPwr">-</span></div>
    <div class="row"><span class="k">内阻（趋势）</span><span class="v" id="hpIr">-</span></div>
    <div class="row"><span class="k">小/中/大核频率</span><span class="v" id="hpCpuFreq">-</span></div>
    <div class="row"><span class="k">负载</span><span class="v" id="hpLoad">-</span></div>
    <div class="hint">健康度优先用实测值（跨 25% 放电区段的库仑计差分），没有样本时退回系统单点值；内阻趋势相对首次记录</div>
  </div>

  <div class="card g">
    <h3>性能档位 <em id="curProfile">读取中</em></h3>
    <div class="seg">
      <button data-prof="balance" id="btnBalance">平衡</button>
      <button data-prof="smooth" id="btnSmooth">流畅</button>
    </div>
    <div class="hint">平衡：省电为主，日常够用<br>流畅：内存与 IO 拉高，滑动手感优先</div>
  </div>

  <div class="card g">
    <h3>参数对照 <em>当前 / 原厂</em></h3>
    <div id="paramList"></div>
  </div>

  <div class="card g">
    <h3>恢复</h3>
    <button class="btn warn" onclick="applyProfile('stock')">恢复全部原厂设置</button>
    <div class="hint">点了之后所有参数回到出厂值，档位不再是平衡/流畅</div>
  </div>

  <div class="card g">
    <h3>场景自动切换 <em id="sceneTag"></em></h3>
    <div class="row">
      <span class="k">充电时自动切到流畅档</span>
      <label class="sw"><input type="checkbox" id="swScene"><i></i></label>
    </div>
    <div class="row">
      <span class="k">夜间 23:00-07:00 切回平衡档</span>
      <span class="v">同一开关</span>
    </div>
    <div class="hint">拔电后回到你手动选的档位。温度降级优先于场景切换，两者不会互相打架</div>
  </div>

  <div class="card g">
    <h3>温度感知降级 <em id="tempTag"></em></h3>
    <div class="row">
      <span class="k">电池过热自动降为平衡档</span>
      <label class="sw"><input type="checkbox" id="swTemp"><i></i></label>
    </div>
    <div class="row">
      <span class="k">当前电池温度</span>
      <span class="v" id="curTemp">-</span>
    </div>
    <div class="row">
      <span class="k">降级 / 恢复阈值</span>
      <span class="v" id="tempTh">42°C / 38°C</span>
    </div>
    <div class="hint">温度回落自动解除。这是主动策略，不改动系统 thermal 与 perf HAL</div>
  </div>
</div>

<!-- ========== 动图 ========== -->
<div class="pane" id="p-motion">
  <div class="card g">
    <h3>自动修复 <em id="motionAutoTag"></em></h3>
    <div class="row">
      <span class="k">开机自动监视</span>
      <label class="sw"><input type="checkbox" id="swAuto"><i></i></label>
    </div>
    <div class="row">
      <span class="k">待处理微视频</span>
      <span class="v" id="mPend">-</span>
    </div>
    <div class="row">
      <span class="k">已修复累计</span>
      <span class="v" id="mDone">-</span>
    </div>
    <div class="hint">开启后每 3 分钟检查一次相机残留的微视频，自动合成进 JPG</div>
  </div>

  <div class="card g">
    <h3>手动操作</h3>
    <div class="btns">
      <button class="btn pri" onclick="motionAct('run')">立即修复一次</button>
      <button class="btn" onclick="showMotionLog()">查看日志</button>
    </div>
    <div class="hint">「立即修复」会扫描 pending 目录并合成，可重复点</div>
  </div>

  <div class="card g" id="mLogCard" style="display:none">
    <h3>修复日志</h3>
    <div class="log" id="mLog">加载中…</div>
  </div>
</div>

<!-- ========== 精简 ========== -->
<div class="pane" id="p-trim">
  <div class="card g">
    <h3>后台限制</h3>
    <div class="row">
      <span class="k">负一屏<em class="tag">省约 170MB</em></span>
      <label class="sw"><input type="checkbox" id="swPa"><i></i></label>
    </div>
    <div class="row">
      <span class="k">谷歌服务后台<em class="tag">Play 仍可用</em></span>
      <label class="sw"><input type="checkbox" id="swGms"><i></i></label>
    </div>
  </div>

  <div class="card g">
    <h3>Play 商店 <em id="playTag"></em></h3>
    <div class="row">
      <span class="k">关自动更新 + 后台压制<em class="tag">省约 500MB</em></span>
      <label class="sw"><input type="checkbox" id="swPlay"><i></i></label>
    </div>
    <div class="row">
      <span class="k">已压制次数</span>
      <span class="v" id="playKills">-</span>
    </div>
    <div class="row">
      <span class="k">当前进程</span>
      <span class="v" id="playState">-</span>
    </div>
    <div class="hint">关闭后不会自动更新应用，需要更新时手动打开 Play 商店点更新。你正在用 Play 时不会被干扰</div>
  </div>

  <div class="card g">
    <h3>系统应用后台</h3>
    <div class="row">
      <span class="k">小米应用商店<em class="tag">省约 140MB</em></span>
      <label class="sw"><input type="checkbox" id="swMarket"><i></i></label>
    </div>
    <div class="row">
      <span class="k">内容中心<em class="tag">省约 160MB</em></span>
      <label class="sw"><input type="checkbox" id="swContent"><i></i></label>
    </div>
    <div class="hint">商店限制后不会后台自动下载应用更新，需要时手动打开更新。内容中心是负一屏资讯推送</div>
  </div>

  <div class="card g">
    <h3>谷歌服务精简 <em id="gmsTag"></em></h3>
    <div class="row">
      <span class="k">关非核心组件<em class="tag">省约 100MB</em></span>
      <label class="sw"><input type="checkbox" id="swGmsSlim"><i></i></label>
    </div>
    <div class="row">
      <span class="k">运行中服务</span>
      <span class="v" id="gmsSvc">-</span>
    </div>
    <div class="hint">只关闭附近共享、晕车辅助、个人安全、魔法网络、统计上报等可选功能。<strong>推送、定位、账号登录、Play 商店全部保留</strong></div>
  </div>

  <div class="card g">
    <h3>后台进程管理</h3>
    <div class="row">
      <span class="k">缓存进程上限 64<em class="tag">减少内存压力</em></span>
      <label class="sw"><input type="checkbox" id="swCached"><i></i></label>
    </div>
    <div class="row">
      <span class="k">当前上限</span>
      <span class="v" id="cachedVal">-</span>
    </div>
    <div class="hint">限制后台缓存的空进程数量，降低内存占用。App 切回时会重新加载</div>
  </div>

  <div class="card g">
    <h3>微信小程序容器 <em id="abTag"></em></h3>
    <div class="row">
      <span class="k">闲置 30 分钟后清理<em class="tag">省约 400MB</em></span>
      <label class="sw"><input type="checkbox" id="swAb"><i></i></label>
    </div>
    <div class="row">
      <span class="k">当前占用</span>
      <span class="v" id="abState">-</span>
    </div>
    <div class="hint">只结束小程序运行时进程，不影响微信本体和聊天记录。再用小程序会重新加载</div>
  </div>

  <div class="card g">
    <h3>动画速度</h3>
    <div class="row">
      <span class="k">动画缩放 0.5 倍</span>
      <label class="sw"><input type="checkbox" id="swAnim"><i></i></label>
    </div>
    <div class="hint">把系统动画时长减半，感觉更快。不影响任何功能</div>
  </div>

  <div class="card g">
    <h3>相机</h3>
    <div class="row">
      <span class="k">闲置自动清理<em class="tag">省约 220MB</em></span>
      <label class="sw"><input type="checkbox" id="swCam"><i></i></label>
    </div>
    <div class="row">
      <span class="k">当前进程</span>
      <span class="v" id="camState">-</span>
    </div>
    <div class="hint">前台不是相机且超过 5 分钟后自动结束。AI 引擎（aicr）未做任何改动</div>
  </div>

  <div class="card g">
    <h3>后台白名单 <em id="wlTag"></em></h3>
    <div class="btns" style="margin-bottom:4px">
      <input id="wlInput" placeholder="com.example.app" style="flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:12.5px;font-family:ui-monospace,monospace">
      <button class="btn" style="width:auto;padding:11px 16px" onclick="wlAdd()">加入</button>
    </div>
    <div id="wlList"><div class="hint">加载中…</div></div>
    <div class="hint">白名单里的应用不受上面的后台限制。某个应用收不到通知时，把它的包名加进来就恢复</div>
  </div>

  <div class="card g">
    <h3>开机自启管理 <em id="bootTag"></em></h3>
    <div class="btns" style="margin-bottom:4px">
      <input id="bootInput" placeholder="com.example.app" style="flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);font-size:12.5px;font-family:ui-monospace,monospace">
      <button class="btn warn" style="width:auto;padding:11px 16px" onclick="bootDisable()">禁自启</button>
    </div>
    <div id="bootList"><div class="hint">加载中…</div></div>
    <div class="hint">只禁用「开机自动启动」的接收器，应用照常能打开、推送不受影响，随时可恢复</div>
  </div>
  <div class="card g">
    <h3>外放音效 <em id="audioTag"></em></h3>
    <div class="row">
      <span class="k">还原低频 / 去破音</span>
      <label class="sw"><input type="checkbox" id="swAudio"><i></i></label>
    </div>
    <div class="hint">把 77–329Hz 的抬升从 7–10dB 降到 3–5dB，800/1k 少压，Movie 档降强度。原理：11U 外放放不出这段低频，抬满只会变成削顶破音。切换会重载音频栈（约 1 秒静音）</div>
  </div>
  <div class="card g">
    <h3>说明</h3>
    <div class="hint">音效改动以 bind mount 方式挂到 /vendor/etc/dolby/dax-default.xml，不修改分区文件；原厂文件已备份到 /data/adb/star-fluency/audio/</div>
  </div>
  <div class="card g">
    <h3>充电限流 <em id="chargeTag"></em></h3>
    <div class="row">
      <span class="k">全速充电（让位所有限流）</span>
      <label class="sw"><input type="checkbox" id="swChargeFull"><i></i></label>
    </div>
    <div class="hint" id="chargeFullHint"></div>
    <div class="row">
      <span class="k">时段内限流（23:00–07:00）</span>
      <label class="sw"><input type="checkbox" id="swChargeNight"><i></i></label>
    </div>
    <div class="row">
      <span class="k">充电上限</span>
      <label class="sw"><input type="checkbox" id="swChargeLimit"><i></i></label>
    </div>
    <div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span class="k">上限百分比</span>
        <span class="v" id="chargeLimitPct">80 %</span>
      </div>
      <input type="range" id="rgChargeLimit" min="50" max="100" step="1" value="80" style="width:100%;height:24px;margin-top:8px;accent-color:var(--lime)">
    </div>
    <div class="row">
      <span class="k">温度分档限流</span>
      <label class="sw"><input type="checkbox" id="swChargeTemp"><i></i></label>
    </div>
    <div class="row"><span class="k">充电电流上限</span><span class="v" id="chargeLimit">-</span></div>
    <div class="row"><span class="k">电池状态</span><span class="v" id="chargeState">-</span></div>
    <div class="row"><span class="k">电池温度</span><span class="v" id="chargeTemp">-</span></div>
    <div class="row"><span class="k">当前限值</span><span class="v" id="chargeTarget">-</span></div>
    <div class="row"><span class="k">当前电量</span><span class="v" id="chargeCap">-</span></div>
    <div class="row"><span class="k">上限状态</span><span class="v" id="chargeLimitState">-</span></div>
    <div class="hint">充电上限：充到设定值就暂停（input_suspend），降到「上限−3%」自动续充；拔电必定解除暂停，避免下次插上不充电。温度/夜间限流是压电流，上限是停止充电，两者可同时开</div>
  </div>
  <div class="card g">
    <h3>其它</h3>
    <div class="row"><span class="k">关键进程绑小核</span><label class="sw"><input type="checkbox" id="swPfAff"><i></i></label></div>

<div id="toast"></div>

<script>
function curProf() {
  return (STATE && STATE.profile && STATE.profile !== 'stock') ? STATE.profile : 'balance';
}
function netReapply(msg) {
  if (msg) toast(msg);
  sh('sh ' + MODDIR + '/scripts/net.sh apply ' + curProf(), function (code) {
    toast(code === 0 ? '网络参数已生效' : '应用失败(' + code + ')');
    sfRefresh();
  });
}
function netSetAndApply(key, val, msg) {
  sh('sh ' + MODDIR + '/scripts/sched.sh setcfg ' + key + ' ' + val, function () { netReapply(msg); });
}
function netTune(p) {
  if (!p) return;
  var chk = function (id, v) { var e = document.getElementById(id); if (e && document.activeElement !== e) e.checked = (v == 1); };
  chk('swNetSS', p.ss_set); chk('swNetMtu', p.mtu_set); chk('swNetTw', p.tw_set);
  var rg = function (id, v) { var e = document.getElementById(id); if (e && document.activeElement !== e) e.value = v; };
  var bpos = [0, 8, 16, 32, 64].indexOf(p.buf_set);
  rg('rgNetBuf', bpos < 0 ? 0 : bpos); rg('rgNetIcw', p.icw_set || 20);
  rg('rgNetNl', Math.round((p.nl_set || 131072) / 1024));
  rg('rgNetFin', p.fin_set || 30);
  var t = function (id, s) { var e = document.getElementById(id); if (e) e.textContent = s; };
  t('nvBuf', (p.buf || 0) + ' MB');
  t('nvIcw', (p.icw || 0) + ' 段');
  t('nvNl', Math.round((p.nl || 0) / 1024) + ' KB');
  t('nvFin', (p.fin || 0) + ' 秒');
  var same = (p.ss == p.ss_set) && (p.mtu == p.mtu_set) && (p.tw == p.tw_set) &&
             (p.fin == p.fin_set) && (p.icw == p.icw_set) &&
             (Math.round((p.nl || 0) / 1024) == Math.round((p.nl_set || 0) / 1024)) &&
             (p.buf == p.buf_eff);
  var tg = document.getElementById('netTuneTag');
  if (tg) tg.innerHTML = same ? '<span class="tag ok">已生效</span>' : '<span class="tag no">未生效</span>';
}
function netDefaults() {
  sh('sh ' + MODDIR + '/scripts/net.sh defaults ' + curProf(), function (code) {
    toast(code === 0 ? '已恢复档位默认' : '失败');
    sfRefresh();
  });
}
['swNetSS:NET_SS', 'swNetMtu:NET_MTU', 'swNetTw:NET_TW'].forEach(function (m) {
  var a = m.split(':'), el = document.getElementById(a[0]);
  if (!el) return;
  el.addEventListener('change', function () {
    netSetAndApply(a[1], this.checked ? 1 : 0, this.checked ? '已开启，应用中…' : '已关闭，应用中…');
  });
});
(function () {
  var BUFV = [0, 8, 16, 32, 64];
  var b = document.getElementById('rgNetBuf');
  if (b) b.addEventListener('change', function () {
    var mb = BUFV[parseInt(this.value, 10)] || 0;
    netSetAndApply('NET_BUF_MB', mb, mb ? ('缓冲 → ' + mb + ' MB') : '缓冲 → 按档位');
  });
  var ci = document.getElementById('rgNetIcw');
  if (ci) ci.addEventListener('change', function () { netSetAndApply('NET_INITCWND', this.value, '初始窗口 → ' + this.value + ' 段'); });
  var nl = document.getElementById('rgNetNl');
  if (nl) nl.addEventListener('change', function () { netSetAndApply('NET_NL', this.value * 1024, '未发送下限 → ' + this.value + ' KB'); });
  var fn = document.getElementById('rgNetFin');
  if (fn) fn.addEventListener('change', function () { netSetAndApply('NET_FIN', this.value, '回收超时 → ' + this.value + ' 秒'); });
})();
/* ========== 桥接层：全管理器适配 + 浏览器 HTTP 降级 ==========
   支持：KernelSU / APatch / KernelSU Next / SukiSU / FinaSU /
         KsuWebUIStandalone / MMRL / WebUI X / AxManager / Magisk(HTTP降级)
   已验证桥对象名：
     KernelSU 系      → ksu
     KsuWebUIStandalone→ ksuwebui   ← 关键，Magisk 用户靠它
     AxManager        → ksu + Axeron
     MMRL             → ksu（ksu.mmrl() 返回 true）
     FinaSU           → ksu / kernelsu / KernelSU / KERNELSU
============================================================ */
var MODDIR = '/data/adb/modules/star_fluency';
var _cbSeq = 0;
var BRIDGE = null, BRIDGE_LABEL = "", BRIDGE_MODE = "none";

function probe() {
  var cands = [
    ["ksu",        function () { return window.ksu; }],
    ["ksuwebui",   function () { return window.ksuwebui; }],
    ["KernelSU",   function () { return window.KernelSU; }],
    ["KERNELSU",   function () { return window.KERNELSU; }],
    ["kernelsu",   function () { return window.kernelsu; }],
    ["Ksu",        function () { return window.Ksu; }],
    ["KSU",        function () { return window.KSU; }],
    ["APatch",     function () { return window.APatch; }],
    ["Apatch",     function () { return window.Apatch; }],
    ["magisk",     function () { return window.magisk; }],
    ["Magisk",     function () { return window.Magisk; }],
    ["mm",         function () { return window.mm; }],
    ["Axeron",     function () { return window.Axeron; }],
    ["axeron",     function () { return window.axeron; }],
    ["exec",       function () { return (typeof window.exec === "function") ? window : null; }],
    ["window.exec",function () { return (typeof exec === "function") ? { exec: exec } : null; }]
  ];
  for (var i = 0; i < cands.length; i++) {
    var o = null;
    try { o = cands[i][1](); } catch (e) { o = null; }
    if (o && typeof o.exec === "function") {
      BRIDGE_LABEL = cands[i][0];
      return o;
    }
  }
  return null;
}
BRIDGE = probe();

/* 判断是否为同步式 exec（只传 cmd 返回字符串）——AxManager / KsuWebUI 有这重载 */
var SYNC_ONLY = false;

function runExec(cmd, opts) {
  return new Promise(function (resolve) {
    if (!BRIDGE) { resolve({ errno: 127, stdout: "", stderr: "NO_BRIDGE" }); return; }
    var name = "__sfcb" + Date.now() + (_cbSeq++);
    var settled = false;
    function done(r) {
      if (settled) return;
      settled = true;
      try { delete window[name]; } catch (e) { window[name] = null; }
      resolve(r);
    }
    window[name] = function (errno, stdout, stderr) {
      done({
        errno: (typeof errno === "number") ? errno : 0,
        stdout: (stdout == null) ? "" : String(stdout),
        stderr: (stderr == null) ? "" : String(stderr)
      });
    };
    try {
      BRIDGE.exec(cmd, JSON.stringify(opts || {}), name);
    } catch (e1) {
      /* 尝试 Promise 式 */
      try {
        var r2 = BRIDGE.exec(cmd, opts || {});
        if (r2 && typeof r2.then === "function") {
          r2.then(function (x) {
            done({
              errno: (x && typeof x.errno === "number") ? x.errno : 0,
              stdout: (x && x.stdout) ? String(x.stdout) : "",
              stderr: (x && x.stderr) ? String(x.stderr) : ""
            });
          })["catch"](function (e2) {
            done({ errno: 1, stdout: "", stderr: String(e2) });
          });
          return;
        }
        /* 最后尝试同步式（返回字符串） */
        if (typeof r2 === "string") {
          SYNC_ONLY = true;
          done({ errno: 0, stdout: r2, stderr: "" });
          return;
        }
      } catch (e2) {
        /* 三参数失败，试两参数同步 */
        try {
          var r3 = BRIDGE.exec(cmd);
          if (typeof r3 === "string") {
            SYNC_ONLY = true;
            done({ errno: 0, stdout: r3, stderr: "" });
            return;
          }
        } catch (e3) {
          done({ errno: 1, stdout: "", stderr: String(e3) });
          return;
        }
        done({ errno: 1, stdout: "", stderr: String(e2) });
        return;
      }
      done({ errno: 1, stdout: "", stderr: String(e1) });
    }
    setTimeout(function () { done({ errno: 124, stdout: "", stderr: "TIMEOUT" }); }, 90000);
  });
}

/* 统一入口 */
function sh(cmd, cb) {
  if (BRIDGE) {
    runExec(cmd, { cwd: "/", env: { PATH: "/data/adb/ksu/bin:/data/adb/magisk:/system/bin:/system/xbin" } })
      .then(function (r) { cb(r.errno, r.stdout, r.stderr); });
  } else {
    /* 无桥（原生 Magisk / 纯浏览器）→ 走 HTTP */
    fetch('/api/sh?cmd=' + encodeURIComponent(cmd))
      .then(function (r) { return r.json(); })
      .then(function (j) { cb(j.code || 0, j.out || '', j.err || ''); })
      .catch(function (e) { cb(-1, '', String(e)); });
  }
}

function histLoad(h) {
  var box = document.getElementById('histBox');
  if (!box) return;
  box.textContent = '加载中…';
  sh('sh ' + MODDIR + '/scripts/batt-hist.sh ' + h + ' 120', function (code, out) {
    if (code !== 0 || !out) { box.textContent = '读取失败'; return; }
    var d; try { d = JSON.parse(out); } catch (e) { box.textContent = '解析失败'; return; }
    var pts = d.pts || [], tps = d.tpts || [];
    if (!pts.length) { box.textContent = '还没有足够的采样数据（每分钟一条，攒一会儿再看）'; return; }
    var W = 320, H = 90, PAD = 4;
    var t0 = pts[0][0], t1 = pts[pts.length - 1][0];
    if (t1 <= t0) t1 = t0 + 1;
    function x(t) { return PAD + (t - t0) / (t1 - t0) * (W - PAD * 2); }
    function ySoc(v) { return H - PAD - (v / 100) * (H - PAD * 2); }
    function yTmp(v) { return H - PAD - ((v - 20) / 30) * (H - PAD * 2); }
    var ps = pts.map(function (p) { return x(p[0]).toFixed(1) + ',' + ySoc(p[1]).toFixed(1); }).join(' ');
    var pt = tps.map(function (p) { return x(p[0]).toFixed(1) + ',' + yTmp(p[1]).toFixed(1); }).join(' ');
    var hrs = Math.round((t1 - t0) / 3600);
    box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:90px;display:block">' +
      '<polyline fill="none" stroke="#4ee0f2" stroke-width="1.6" points="' + ps + '"/>' +
      '<polyline fill="none" stroke="#f2b84e" stroke-width="1.2" opacity=".8" points="' + pt + '"/>' +
      '</svg>' +
      '<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--dim)">' +
      '<span>电量 ' + (d.soc_min || 0) + '–' + (d.soc_max || 0) + '%</span><span>' + (d.n || 0) + ' 个采样 / 近 ' + hrs + ' 小时</span></div>';
    var tag = document.getElementById('histTag');
    if (tag) tag.textContent = hrs + ' 小时';
  });
}
