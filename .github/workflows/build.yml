name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取版本
        id: ver
        run: |
          VER=$(grep '^version=' module.prop | cut -d= -f2)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "版本: $VER"

      - name: 校验脚本语法
        run: |
          fail=0
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            if ! sh -n "$f"; then
              echo "❌ 语法错误: $f"
              fail=1
            else
              echo "✅ $f"
            fi
          done
          [ $fail -eq 0 ] || exit 1

      - name: 校验必要文件
        run: |
          for f in module.prop post-fs-data.sh service.sh webroot/index.html \
                   scripts/apply.sh scripts/status.sh scripts/motion.sh scripts/zram-algo.sh; do
            [ -f "$f" ] || { echo "❌ 缺少 $f"; exit 1; }
            echo "✅ $f"
          done

      - name: 校验版本一致性
        run: |
          V1=$(grep '^version=' module.prop | cut -d= -f2)
          V2=$(grep '^versionCode=' module.prop | cut -d= -f2)
          echo "version=$V1 versionCode=$V2"
          [ -n "$V1" ] && [ -n "$V2" ] || exit 1

      - name: 打包
        run: |
          VER=${{ steps.ver.outputs.version }}
          mkdir -p out
          # 排除开发和 CI 文件
          zip -r "out/Star-Fluency-${VER}.zip" . \
            -x ".git/*" -x ".github/*" -x "out/*" -x "*.md" -x "*.bak*" -x "README*"
          cp "out/Star-Fluency-${VER}.zip" out/Star-Fluency.zip
          cd out && sha256sum *.zip > Star-Fluency.zip.sha256
          ls -lh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Star-Fluency
          path: out/*.zip*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: Star-Fluency
          path: out

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip*
          generate_release_notes: true
